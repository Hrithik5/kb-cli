name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Show versions
        run: |
          python --version
          pip --version

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Show Ruff version
        run: |
          ruff --version

      - name: Ruff
        run: |
          ruff check .

      - name: Tests
        run: |
          pytest -v

      - name: Build package
        run: |
          python -m pip install build
          python -m build
