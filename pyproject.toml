[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-cli"
version = "0.1.1"
description = "Lightning-fast offline developer knowledge engine powered by SQLite FTS5."
readme = "README.md"
authors = [{ name = "Hrithik Chauhan" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "cli",
  "knowledge-base",
  "fts5",
  "sqlite",
  "snippets",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/Hrithik5/kb-cli"
Repository = "https://github.com/Hrithik5/kb-cli"
Issues = "https://github.com/Hrithik5/kb-cli/issues"

[project.scripts]
kb = "kb.main:main"

[project.optional-dependencies]
dev = ["ruff==0.16.1", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kb*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
